<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LLT – London Live Transport</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="LLT">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#16181b" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Overpass:wght@400;600;800&family=Overpass+Mono:wght@600&family=IBM+Plex+Mono:wght@400;500;700&display=swap">
<style>
/* Layout: full-bleed map, floating Bus | Tube switch, bottom sheet for a stop's departures */
:root {
  --bg: #ffffff;
  --surface: #ffffff;
  --fg: #1b1d21;
  --muted: #646a73;
  --line: #e4e6ea;
  --red: #d4261b;
  --navy: #1d3a8f;
  --pin-ink: #ffffff;
  --chip: #f2f3f5;
  --accent: var(--red);
  --shadow: 0 6px 24px rgba(20, 22, 28, .18);
  --font: "Overpass", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "Overpass Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --tile-filter: grayscale(.55) sepia(.5) saturate(.9) brightness(1.04) contrast(.9);
  --station-ink: #1f1d17;
  /* Departure board */
  --paper: #f6f2e0;
  --paper-ink: #1f1d17;
  --paper-muted: #6f6a57;
  --board: #222222;
  --board-line: #2f2f2f;
  --board-chip: #383838;
  --amber: #f5cd47;
  --amber-dim: #b89a3a;
  --board-font: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #16181b;
    --surface: #1f2226;
    --fg: #eceef1;
    --muted: #9aa0a9;
    --line: #30343a;
    --red: #e5392d;
    --navy: #4a6fd8;
    --chip: #2a2e33;
    --shadow: 0 6px 24px rgba(0, 0, 0, .5);
    --tile-filter: grayscale(.6) invert(1) hue-rotate(180deg) sepia(.35) brightness(.85) contrast(.9);
    --station-ink: #0f0f0e;
    --paper: #1d1c17;
    --paper-ink: #ece6cf;
    --paper-muted: #9c9680;
    --board: #0f0f0e;
    --board-line: #232320;
    --board-chip: #2a2a27;
    color-scheme: dark;
  }
}
body[data-mode="tube"] { --accent: var(--navy); }

* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg);
  color: var(--fg);
  font: 15px/1.4 var(--font);
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
}
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

#map { position: fixed; inset: 0; background: var(--paper); }
.leaflet-tile-pane { filter: var(--tile-filter); }
.leaflet-control-attribution {
  background: color-mix(in srgb, var(--surface) 80%, transparent) !important;
  color: var(--muted) !important;
  font-size: 10px !important;
}
.leaflet-control-attribution a { color: var(--muted) !important; }

/* Top bar */
.topbar {
  position: fixed; z-index: 500;
  top: calc(env(safe-area-inset-top, 0px) + 10px);
  left: max(12px, env(safe-area-inset-left, 0px));
  right: max(12px, env(safe-area-inset-right, 0px));
  display: flex; gap: 8px; align-items: center; justify-content: space-between;
  pointer-events: none;
}
.topbar > * { pointer-events: auto; }
.brand {
  display: flex; align-items: center; gap: 8px; flex: none;
  background: var(--surface); border-radius: 999px; padding: 6px 12px 6px 6px;
  box-shadow: var(--shadow); font-weight: 800; letter-spacing: .02em;
}
.brand .dot {
  width: 26px; height: 26px; border-radius: 50%; background: var(--accent);
  display: grid; place-items: center; transition: background .2s;
}
.brand .dot::after { content: ""; width: 12px; height: 12px; border-radius: 50%; background: var(--surface); }

.switch {
  display: flex; padding: 4px; gap: 2px;
  background: var(--surface); border-radius: 999px; box-shadow: var(--shadow);
}
.switch button {
  border: 0; background: none; border-radius: 999px;
  padding: 7px 16px 5px; font-weight: 800; font-size: 14px; letter-spacing: .02em;
  color: var(--muted);
}
.switch button[aria-pressed="true"] { background: var(--accent); color: var(--pin-ink); }

.round {
  width: 44px; height: 44px; border-radius: 50%; border: 0; flex: none;
  background: var(--surface); box-shadow: var(--shadow);
  display: grid; place-items: center;
}
.round svg { width: 20px; height: 20px; }
.hint {
  position: fixed; z-index: 500; left: 50%; transform: translateX(-50%);
  top: calc(env(safe-area-inset-top, 0px) + 66px);
  background: var(--surface); color: var(--fg); box-shadow: var(--shadow);
  border-radius: 999px; padding: 7px 14px; font-size: 13px; font-weight: 600;
  white-space: nowrap;
}

/* Pins */
.pin {
  width: 28px; height: 28px; border-radius: 50%;
  background: var(--red); color: var(--pin-ink);
  border: 2px solid #fff; box-shadow: 0 2px 6px rgba(0,0,0,.35);
  display: grid; place-items: center;
  font: 800 11px/1 var(--font); letter-spacing: -.02em;
}
.hit { position: relative; width: 30px; height: 30px; display: grid; place-items: center; }
.pin.tube {
  width: 16px; height: 16px;
  background: color-mix(in srgb, var(--station-ink) 10%, transparent);
  border: 3.5px solid color-mix(in srgb, var(--station-ink) 50%, transparent);
  box-shadow: none;
}
.pin.fav { box-shadow: 0 0 0 3px #f5b400, 0 2px 6px rgba(0,0,0,.35); }
.pin.sel { transform: scale(1.25); }
.pin-label {
  position: absolute; left: 50%; top: 26px; transform: translateX(-50%);
  white-space: nowrap; font: 700 10px/1.2 var(--board-font); text-transform: uppercase; letter-spacing: .06em; color: var(--paper-ink);
  background: color-mix(in srgb, var(--surface) 85%, transparent);
  padding: 2px 5px; border-radius: 4px; pointer-events: none;
}
.me { position: relative; width: 22px; height: 22px; }
.me::before {
  content: ""; position: absolute; inset: -9px; border-radius: 50%;
  background: rgba(30, 115, 245, .28); animation: me-pulse 2s ease-out infinite;
}
.me::after {
  content: ""; position: absolute; inset: 0; border-radius: 50%;
  background: #1e73f5; border: 3.5px solid #fff; box-shadow: 0 1px 5px rgba(0,0,0,.4);
}
@keyframes me-pulse { 0% { transform: scale(.5); opacity: 1; } 100% { transform: scale(1.6); opacity: 0; } }
.round.following { color: #1e73f5; }
@media (prefers-reduced-motion: reduce) { .me::before { animation: none; } }

/* Bottom sheet */
.sheet {
  position: fixed; z-index: 600; left: 0; right: 0; bottom: 0;
  background: var(--surface); color: var(--fg);
  border-radius: 18px 18px 0 0; box-shadow: var(--shadow);
  max-height: 66%; display: flex; flex-direction: column;
  padding-bottom: env(safe-area-inset-bottom, 0px);
  transform: translateY(0); transition: transform .25s ease;
}
.sheet.closed { transform: translateY(105%); }
.grab { width: 38px; height: 5px; border-radius: 3px; background: var(--line); margin: 8px auto 2px; }
.sheet-head {
  display: flex; gap: 12px; align-items: flex-start;
  padding: 8px max(16px, env(safe-area-inset-right, 0px)) 12px max(16px, env(safe-area-inset-left, 0px));
  border-bottom: 1px solid var(--line);
}
.letter {
  flex: none; width: 40px; height: 40px; border-radius: 50%;
  background: var(--red); color: var(--pin-ink);
  display: grid; place-items: center; font-weight: 800; font-size: 16px;
}
.letter.tube { background: transparent; border: 7px solid var(--paper-ink); }
.titles { flex: 1; min-width: 0; }
.titles h2 { margin: 0; font-size: 18px; line-height: 1.2; font-weight: 800; text-wrap: balance; }
.titles .sub { color: var(--muted); font-size: 13px; margin-top: 2px; }
.routes { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
.routes span {
  font: 600 11px/1 var(--mono); padding: 4px 6px; border-radius: 4px;
  background: var(--chip); color: var(--fg);
}
.routes span.ln { font-family: var(--font); font-weight: 800; padding: 4px 7px 3px; }
.head-actions { display: flex; gap: 6px; flex: none; }
.icon-btn {
  width: 36px; height: 36px; border-radius: 50%; border: 0;
  background: var(--chip); display: grid; place-items: center;
}
.icon-btn svg { width: 18px; height: 18px; }
.icon-btn[aria-pressed="true"] svg { fill: #f5b400; stroke: #f5b400; }

.list { overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 6px max(16px, env(safe-area-inset-right, 0px)) 14px max(16px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 18px; }

/* Departure board */
.section { display: flex; flex-direction: column; gap: 8px; }
.sec-head { display: flex; align-items: center; gap: 10px; min-width: 0; font: 700 15px/1.2 var(--board-font); color: var(--paper-ink); }
.sec-head .plat { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.line-tag { flex: none; font: 700 12px/1 var(--board-font); padding: 5px 7px 4px; border-radius: 4px; }
.board {
  background: var(--board); border-radius: 8px; padding: 6px 0;
  box-shadow: 0 8px 24px rgba(40, 34, 10, .18);
  font-family: var(--board-font); color: var(--amber);
}
.b-row {
  display: grid; grid-template-columns: 22px auto 1fr auto; gap: 12px; align-items: center;
  padding: 10px 14px;
}
.b-row + .b-row { border-top: 1px solid var(--board-line); }
.board.tube .b-row { grid-template-columns: 22px 1fr auto; }
.b-n { font-weight: 700; font-size: 17px; }
.b-route { font-weight: 700; font-size: 17px; min-width: 2.6em; }
.b-dest { min-width: 0; font-size: 16px; }
.b-dest span { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.b-dest small { display: block; color: var(--amber-dim); font-size: 11px; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.b-due {
  background: var(--board-chip); border-radius: 6px; padding: 7px 10px 6px;
  font-size: 16px; font-variant-numeric: tabular-nums; text-align: center; min-width: 4.6em;
}
.b-due.now { animation: blink 1.2s steps(2, start) infinite; }
@keyframes blink { to { color: transparent; } }

.note { padding: 18px 16px; color: var(--muted); text-align: center; }
.foot {
  display: flex; justify-content: space-between; align-items: center;
  padding: 8px max(16px, env(safe-area-inset-right, 0px)) 10px max(16px, env(safe-area-inset-left, 0px));
  color: var(--muted); font-size: 12px; border-top: 1px solid var(--line);
}
.foot button { background: none; border: 0; color: var(--accent); font-weight: 600; padding: 4px 0; }

/* Saved stops */
.saved-btn {
  position: fixed; z-index: 550;
  right: max(12px, env(safe-area-inset-right, 0px));
  bottom: calc(env(safe-area-inset-bottom, 0px) + 28px);
  width: 50px; height: 50px; border-radius: 50%; border: 0;
  background: color-mix(in srgb, var(--surface) 50%, transparent);
  -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
  box-shadow: 0 4px 14px rgba(20, 22, 28, .14);
  display: grid; place-items: center; color: #b88a00;
}
.saved-btn svg { width: 24px; height: 24px; }
.saved-btn .badge {
  position: absolute; top: -2px; right: -2px; min-width: 19px; height: 19px; padding: 0 5px;
  border-radius: 10px; background: var(--paper-ink); color: var(--paper);
  font: 700 11px/19px var(--board-font); text-align: center;
}
.sheet .txt-btn { background: none; border: 0; padding: 6px 2px; font: 600 13px var(--board-font); color: var(--paper-ink); text-decoration: underline; text-underline-offset: 3px; }
.sv-row { display: flex; gap: 8px; align-items: stretch; }
.sv-main { flex: 1; min-width: 0; border: 0; background: none; padding: 0; text-align: left; display: flex; flex-direction: column; gap: 6px; color: var(--paper-ink); }
.sv-top { display: flex; gap: 10px; align-items: center; min-width: 0; }
.sv-ic { flex: none; width: 26px; height: 26px; border-radius: 50%; background: var(--red); color: var(--pin-ink); display: grid; place-items: center; font: 800 11px/1 var(--font); }
.sv-ic.tube { background: color-mix(in srgb, var(--paper-ink) 10%, transparent); border: 5px solid color-mix(in srgb, var(--paper-ink) 55%, transparent); }
.sv-txt { min-width: 0; }
.sv-txt b { display: block; font: 700 14px/1.25 var(--board-font); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sv-txt small { display: block; font: 500 12px/1.3 var(--board-font); color: var(--paper-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sv-next { background: var(--board); color: var(--amber); font: 500 13px/1.2 var(--board-font); border-radius: 6px; padding: 9px 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-variant-numeric: tabular-nums; }
.sv-next.dim { color: var(--amber-dim); }
.sv-del { flex: none; width: 40px; border: 0; border-radius: 8px; background: color-mix(in srgb, var(--paper-ink) 9%, transparent); color: var(--paper-ink); display: grid; place-items: center; }
.sv-del svg { width: 18px; height: 18px; }
.routes button { border: 0; font: 600 11px/1 var(--board-font); padding: 5px 7px; border-radius: 4px; background: color-mix(in srgb, var(--paper-ink) 9%, transparent); color: var(--paper-ink); }
.routes button[aria-pressed="true"] { background: var(--board); color: var(--amber); }
.pstar { margin-left: auto; flex: none; width: 32px; height: 32px; border: 0; border-radius: 50%; background: none; display: grid; place-items: center; color: var(--paper-ink); }
.pstar svg { width: 18px; height: 18px; }
.pstar[aria-pressed="true"] svg { fill: #f5b400; stroke: #f5b400; }
.show-all { align-self: flex-start; background: none; border: 0; padding: 4px 0; font: 600 13px var(--board-font); color: var(--paper-ink); text-decoration: underline; text-underline-offset: 3px; }

@media (max-width: 360px) {
  .brand { padding-right: 6px; }
  .brand .txt { display: none; }
  .switch button { padding: 7px 12px 5px; }
}
@media (prefers-reduced-motion: reduce) { .sheet { transition: none; } }
/* Stop sheet in departure-board style */
.sheet { background: var(--paper); color: var(--paper-ink); max-height: 70%; }
.sheet .grab { background: color-mix(in srgb, var(--paper-ink) 18%, transparent); }
.sheet-head { border-bottom: 0; padding-bottom: 6px; }
.titles h2 { font: 700 21px/1.2 var(--board-font); letter-spacing: -.01em; }
.titles .sub { color: var(--paper-muted); font-family: var(--board-font); }
.routes span { background: color-mix(in srgb, var(--paper-ink) 9%, transparent); color: var(--paper-ink); font-family: var(--board-font); }
.sheet .icon-btn { background: color-mix(in srgb, var(--paper-ink) 9%, transparent); color: var(--paper-ink); }
.sheet .note { color: var(--paper-muted); font-family: var(--board-font); }
.sheet .foot { border-top: 0; color: var(--paper-muted); font-family: var(--board-font); }
.sheet .foot button { color: var(--paper-ink); text-decoration: underline; text-underline-offset: 3px; }
@media (prefers-reduced-motion: reduce) { .b-due.now { animation: none; } }
</style>
</head>
<body data-mode="bus">
<div id="map" aria-label="Map of stops and stations"></div>

<div class="topbar">
  <div class="brand"><span class="dot" aria-hidden="true"></span><span class="txt">LLT</span></div>
  <div class="switch" role="group" aria-label="Transport type">
    <button id="mode-bus" data-mode="bus" aria-pressed="true">Bus</button>
    <button id="mode-tube" data-mode="tube" aria-pressed="false">Tube</button>
  </div>
  <button class="round" id="locate" aria-label="Show my location">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>
  </button>
</div>
<div class="hint" id="hint" hidden></div>

<button class="saved-btn" id="saved-btn" aria-label="Saved stops"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 3l2.8 5.7 6.2.9-4.5 4.4 1.1 6.2L12 17.3 6.4 20.2l1.1-6.2L3 9.6l6.2-.9z"/></svg><span class="badge" id="saved-count" hidden></span></button>

<section class="sheet closed" id="saved" aria-live="polite">
  <div class="grab" aria-hidden="true"></div>
  <div class="sheet-head">
    <div class="titles"><h2>Saved</h2><div class="sub" id="sv-sub"></div></div>
    <div class="head-actions">
      <button class="txt-btn" id="sv-edit" hidden>Edit</button>
      <button class="icon-btn" id="sv-close" aria-label="Close">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
  </div>
  <div class="list" id="sv-list"></div>
</section>

<section class="sheet closed" id="sheet" aria-live="polite">
  <div class="grab" aria-hidden="true"></div>
  <div class="sheet-head">
    <div class="letter" id="s-letter"></div>
    <div class="titles">
      <h2 id="s-name"></h2>
      <div class="sub" id="s-sub"></div>
      <div class="routes" id="s-routes"></div>
    </div>
    <div class="head-actions">
      <button class="icon-btn" id="s-fav" aria-pressed="false" aria-label="Save stop">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 3l2.8 5.7 6.2.9-4.5 4.4 1.1 6.2L12 17.3 6.4 20.2l1.1-6.2L3 9.6l6.2-.9z"/></svg>
      </button>
      <button class="icon-btn" id="s-close" aria-label="Close">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
  </div>
  <div class="list" id="s-list"></div>
  <div class="foot"><span id="s-updated"></span><button id="s-refresh">Refresh</button></div>
</section>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
// Optional: a free key from https://api-portal.tfl.gov.uk raises TfL's rate limit.
const APP_KEY = "";
const VERSION = "26 Oct · 2";  // shown bottom-right on the map, to check which build the phone has
const API = "https://api.tfl.gov.uk";
const REFRESH_MS = 30000;

const MODES = {
  bus:  { stopTypes: "NaptanPublicBusCoachTram", modes: "bus",  minZoom: 16, maxRadius: 1000, hint: "Zoom in to see bus stops" },
  tube: { stopTypes: "NaptanMetroStation",       modes: "tube", minZoom: 12, maxRadius: 3000, hint: "Zoom in to see Tube stations" }
};

// Line colours (background, text)
const LINE_COLOURS = {
  "bakerloo": ["#B36305", "#fff"], "central": ["#E32017", "#fff"], "circle": ["#FFD300", "#1b1d21"],
  "district": ["#00782A", "#fff"], "hammersmith-city": ["#F3A9BB", "#1b1d21"], "jubilee": ["#A0A5A9", "#1b1d21"],
  "metropolitan": ["#9B0056", "#fff"], "northern": ["#000000", "#fff"], "piccadilly": ["#003688", "#fff"],
  "victoria": ["#0098D4", "#fff"], "waterloo-city": ["#95CDBA", "#1b1d21"]
};
const lineStyle = (id) => {
  const [bg, fg] = LINE_COLOURS[id] || ["var(--chip)", "var(--fg)"];
  return `background:${bg};color:${fg}`;
};

const $ = (id) => document.getElementById(id);
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
};
function url(path, params = {}) {
  const u = new URL(API + path);
  for (const [k, v] of Object.entries(params)) u.searchParams.set(k, v);
  if (APP_KEY) u.searchParams.set("app_key", APP_KEY);
  return u.toString();
}
async function getJSON(u, signal) {
  const r = await fetch(u, { signal });
  if (!r.ok) throw new Error("HTTP " + r.status);
  return r.json();
}
const cleanLetter = (s) => (s || "").replace(/^->/, "").slice(0, 3);
const cleanStation = (s) => (s || "").replace(/ (Underground|DLR|Rail) Station$/i, "").replace(/ Station$/i, "");
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

// ---------- State ----------
let mode = store.get("mode", "bus");
if (!MODES[mode]) mode = "bus";
let favs = store.get("favs", []).map((f) => ({ mode: "bus", ...f })); // older favourites were all bus stops
let selectedId = null;
const markers = new Map(); // naptanId -> marker (current mode only)
const stops = new Map();   // naptanId -> stop (current mode only)

// ---------- Map ----------
const last = store.get("view", { lat: 51.5074, lng: -0.1278, z: 16 });
const map = L.map("map", { zoomControl: false }).setView([last.lat, last.lng], last.z);
// Base map: OpenStreetMap, tinted to a warm paper tone in CSS (no key needed)
L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
  maxZoom: 19,
  attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> · Powered by TfL Open Data · LLT ' + VERSION
}).addTo(map);

// Tube lines: route shapes from TfL, cached on the device for 30 days
map.createPane("lines").style.zIndex = 350;
const lineLayer = L.layerGroup();
const LINES_KEY = "tubeNetwork.v4";
let linesPromise = null;
function ensureTubeLines() {
  if (!linesPromise) linesPromise = drawTubeLines().catch(() => { linesPromise = null; });
  return linesPromise;
}
async function drawTubeLines() {
  let cached = store.get(LINES_KEY, null);
  if (!cached || Date.now() - cached.t > 30 * 864e5) {
    const ids = Object.keys(LINE_COLOURS);
    // Shapes come from Route/Sequence; stations come from Line/StopPoints, which always
    // uses the Underground station id (Route/Sequence gives interchanges a HUB id with no Tube times)
    const results = await Promise.all(ids.map(async (id) => {
      const [route, sps] = await Promise.all([
        getJSON(url(`/Line/${id}/Route/Sequence/outbound`)).catch(() => null),
        getJSON(url(`/Line/${id}/StopPoints`)).catch(() => null)
      ]);
      const segs = route ? (route.lineStrings || []).flatMap((s) => JSON.parse(s))
        .map((seg) => seg.map(([lon, lat]) => [+lat.toFixed(5), +lon.toFixed(5)])) : null;
      const sts = sps
        ? sps.map((s) => ({ id: s.naptanId, name: s.commonName, lat: s.lat, lon: s.lon, lines: s.lines }))
        : (route?.stations || []);
      return [id, segs, sts];
    }));
    const lines = {}, stations = {};
    for (const [id, segs, sts] of results) {
      if (segs && segs.length) lines[id] = segs;
      for (const s of sts || []) {
        const sid = s.id || s.stationId;
        if (!sid || !s.lat) continue;
        const st = stations[sid] || (stations[sid] = { naptanId: sid, commonName: s.name, lat: +s.lat.toFixed(5), lon: +s.lon.toFixed(5), lines: [] });
        for (const l of s.lines || []) if (LINE_COLOURS[l.id] && !st.lines.some((x) => x.id === l.id)) st.lines.push({ id: l.id, name: l.name });
      }
    }
    if (!Object.keys(lines).length) throw new Error("no lines");
    // Interchanges (e.g. Blackfriars, Victoria) come back as "HUB…" ids, which have no
    // Tube arrivals. Swap each for its Underground station id ("940G…").
    const hubMap = await resolveHubs(Object.keys(stations).filter((id) => id.startsWith("HUB")));
    const merged = {};
    for (const st of Object.values(stations)) {
      const id = hubMap[st.naptanId] || st.naptanId;
      const m = merged[id] || (merged[id] = { ...st, naptanId: id, lines: [] });
      for (const l of st.lines) if (!m.lines.some((x) => x.id === l.id)) m.lines.push(l);
    }
    cached = { t: Date.now(), lines, stations: merged, hubMap };
    store.set(LINES_KEY, cached);
  }
  lineLayer.clearLayers();
  for (const [id, segs] of Object.entries(cached.lines)) {
    L.polyline(segs, {
      pane: "lines", color: LINE_COLOURS[id][0], weight: 7, opacity: .55,
      lineCap: "round", lineJoin: "round", interactive: false
    }).addTo(lineLayer);
  }
  tubeStations = Object.values(cached.stations || {});
  hubToTube = cached.hubMap || {};
  migrateHubFavs();
}
let hubToTube = {};
// Look up the Underground station inside each interchange, 20 ids per request
async function resolveHubs(ids) {
  const out = {};
  for (let i = 0; i < ids.length; i += 20) {
    const batch = ids.slice(i, i + 20);
    try {
      let data = await getJSON(url(`/StopPoint/${batch.map(encodeURIComponent).join(",")}`));
      if (!Array.isArray(data)) data = [data];
      for (const hub of data) {
        const tube = (hub.children || []).find((c) => c.stopType === "NaptanMetroStation" && (c.modes || []).includes("tube"))
          || (hub.children || []).find((c) => (c.naptanId || "").startsWith("940GZZLU"));
        if (tube) out[hub.naptanId || hub.id] = tube.naptanId;
      }
    } catch {}
  }
  return out;
}
// Older saved items may still point at a HUB id
function migrateHubFavs() {
  let changed = false;
  for (const f of favs) {
    const id = hubToTube[f.id];
    if (f.mode === "tube" && id) { f.id = id; f.key = favKey(id, f.filter); changed = true; }
  }
  if (changed) store.set("favs", favs);
}
// Safety net for any id that slipped through: resolve on demand
async function tubeId(id) {
  if (!id.startsWith("HUB")) return id;
  if (hubToTube[id]) return hubToTube[id];
  const m = await resolveHubs([id]);
  if (m[id]) hubToTube[id] = m[id];
  return hubToTube[id] || id;
}
let tubeStations = [];

function pinIcon(stop) {
  const cls = ["pin"];
  if (mode === "tube") cls.push("tube");
  if (favs.some((f) => f.id === stop.naptanId)) cls.push("fav");
  if (stop.naptanId === selectedId) cls.push("sel");
  const text = mode === "bus" ? esc(cleanLetter(stop.stopLetter)) : "";
  const label = mode === "tube" && map.getZoom() >= 15 ? `<div class="pin-label">${esc(cleanStation(stop.commonName))}</div>` : "";
  return L.divIcon({
    className: "",
    html: `<div class="hit"><div class="${cls.join(" ")}">${text}</div>${label}</div>`,
    iconSize: [30, 30], iconAnchor: [15, 15]
  });
}
function refreshPin(id) {
  const m = markers.get(id), s = stops.get(id);
  if (m && s) m.setIcon(pinIcon(s));
}
function clearPins() {
  for (const m of markers.values()) m.remove();
  markers.clear(); stops.clear();
}

let loadCtl = null, loadTimer = null, lastZoom = map.getZoom();
function scheduleLoad() {
  clearTimeout(loadTimer);
  loadTimer = setTimeout(loadStops, 250);
}
function setHint(text) { $("hint").textContent = text; $("hint").hidden = !text; }

function addMarker(s) {
  stops.set(s.naptanId, s);
  if (markers.has(s.naptanId)) return;
  const m = L.marker([s.lat, s.lon], { icon: pinIcon(s), title: s.commonName })
    .on("click", () => openStop(s))
    .addTo(map);
  markers.set(s.naptanId, m);
}
async function loadStops() {
  const c = map.getCenter(), z = map.getZoom(), cfg = MODES[mode];
  store.set("view", { lat: c.lat, lng: c.lng, z });
  // Tube labels appear/disappear with zoom, so redraw icons when crossing that line
  if (mode === "tube" && (lastZoom >= 15) !== (z >= 15)) for (const id of markers.keys()) refreshPin(id);
  lastZoom = z;

  if (z < cfg.minZoom) { setHint(cfg.hint); return; }
  setHint("");

  if (mode === "tube") {
    await ensureTubeLines();
    if (mode !== "tube" || markers.size) return;
    if (!tubeStations.length) { flashHint("Couldn't load stations. Check your connection."); return; }
    for (const s of tubeStations) addMarker(s);
    return;
  }

  const radius = Math.min(cfg.maxRadius, Math.max(200, Math.round(c.distanceTo(map.getBounds().getNorthEast()))));
  loadCtl?.abort();
  loadCtl = new AbortController();
  const forMode = mode;
  try {
    const data = await getJSON(url("/StopPoint", {
      lat: c.lat.toFixed(5), lon: c.lng.toFixed(5),
      stopTypes: cfg.stopTypes, modes: cfg.modes, radius
    }), loadCtl.signal);
    if (forMode !== mode) return;
    for (const s of data.stopPoints || []) {
      if (!s.lines || s.lines.length === 0 || !s.lat) continue;
      if (forMode === "tube") s.lines = s.lines.filter((l) => LINE_COLOURS[l.id]);
      if (!s.lines.length) continue;
      addMarker(s);
    }
  } catch (e) {
    if (e.name !== "AbortError") flashHint("Couldn't load " + (mode === "bus" ? "stops" : "stations") + ". Check your connection.");
  }
}
function flashHint(text) {
  setHint(text);
  setTimeout(() => setHint(map.getZoom() < MODES[mode].minZoom ? MODES[mode].hint : ""), 3000);
}
map.on("moveend", scheduleLoad);

// ---------- Bus | Tube switch ----------
function setMode(next, { load = true } = {}) {
  mode = next;
  store.set("mode", mode);
  document.body.dataset.mode = mode;
  for (const b of document.querySelectorAll(".switch button")) b.setAttribute("aria-pressed", String(b.dataset.mode === mode));
  closeStop();
  clearPins();
  if (mode === "tube") { lineLayer.addTo(map); ensureTubeLines(); } else { lineLayer.remove(); }
  if (load) {
    // Tube stations are further apart, so zoom out a little when switching to them
    if (mode === "tube" && map.getZoom() > 15) map.setZoom(15);
    else if (mode === "bus" && map.getZoom() < MODES.bus.minZoom) map.setZoom(MODES.bus.minZoom);
    else loadStops();
  }
}
for (const b of document.querySelectorAll(".switch button")) {
  b.addEventListener("click", () => { if (b.dataset.mode !== mode) setMode(b.dataset.mode); });
}

// ---------- Location ----------
// ---------- My position ----------
// Blue dot with an accuracy circle, kept up to date while the app is open.
map.createPane("me").style.zIndex = 650;      // above stop pins
map.createPane("meAcc").style.zIndex = 340;   // under Tube lines and pins
let meMarker = null, meAcc = null, watchId = null, haveFix = false, flyNext = false, lastFix = null;
const meIcon = L.divIcon({ className: "", html: '<div class="me" aria-label="Your position"></div>', iconSize: [22, 22], iconAnchor: [11, 11] });

function showPosition(p) {
  const ll = [p.coords.latitude, p.coords.longitude];
  lastFix = ll;
  if (!meMarker) {
    meMarker = L.marker(ll, { icon: meIcon, pane: "me", interactive: false, keyboard: false }).addTo(map);
    meAcc = L.circle(ll, { radius: p.coords.accuracy, pane: "meAcc", interactive: false,
      color: "#1e73f5", weight: 1, opacity: .35, fillColor: "#1e73f5", fillOpacity: .1 }).addTo(map);
  } else {
    meMarker.setLatLng(ll);
    meAcc.setLatLng(ll).setRadius(p.coords.accuracy);
  }
  $("locate").classList.add("following");
  if (flyNext) { flyNext = false; map.setView(ll, Math.max(map.getZoom(), mode === "tube" ? 15 : 17)); }
  haveFix = true;
}
function startWatch() {
  if (!navigator.geolocation || watchId !== null) return;
  watchId = navigator.geolocation.watchPosition(showPosition, (err) => {
    if (err.code === 1) { stopWatch(); $("locate").classList.remove("following"); }
  }, { enableHighAccuracy: true, timeout: 15000, maximumAge: 5000 });
}
function stopWatch() {
  if (watchId !== null) navigator.geolocation.clearWatch(watchId);
  watchId = null;
}
function locate(fly, fromButton = false) {
  if (!navigator.geolocation) return;
  if (fly && lastFix) { map.setView(lastFix, Math.max(map.getZoom(), mode === "tube" ? 15 : 17)); fly = false; }
  flyNext = fly;
  navigator.geolocation.getCurrentPosition((p) => { showPosition(p); startWatch(); },
    () => { flyNext = false; if (fromButton) flashHint("Location is off. Allow it in Settings to see where you are."); },
    { enableHighAccuracy: true, timeout: 10000, maximumAge: 30000 });
}
$("locate").addEventListener("click", () => locate(true, true));

// ---------- Saved items ----------
// A saved item is a stop plus an optional filter:
//   bus  -> { routes: ["87","139"] }      tube -> { lineId, lineName, platform }
const STAR_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 3l2.8 5.7 6.2.9-4.5 4.4 1.1 6.2L12 17.3 6.4 20.2l1.1-6.2L3 9.6l6.2-.9z"/></svg>';
function favKey(id, filter) {
  if (!filter) return id + "|";
  if (filter.routes) return id + "|r:" + [...filter.routes].sort().join(",");
  return id + "|p:" + filter.lineId + ":" + filter.platform;
}
favs = favs.map((f) => ({ filter: null, ...f, key: f.key || favKey(f.id, f.filter || null) }));
const saveFavs = () => store.set("favs", favs);
const isSaved = (key) => favs.some((f) => f.key === key);
const direction = (platform) => (platform || "").split(" - ")[0];
function filterLabel(f) {
  if (!f.filter) return f.mode === "tube" ? "All lines" : (f.indicator || "All routes");
  if (f.filter.routes) return "Routes " + f.filter.routes.join(", ");
  return `${f.filter.lineName} · ${direction(f.filter.platform)}`;
}
function toggleSaved(s, filter) {
  const key = favKey(s.naptanId, filter);
  if (isSaved(key)) favs = favs.filter((f) => f.key !== key);
  else favs.push({
    key, id: s.naptanId, mode, filter,
    name: mode === "tube" ? cleanStation(s.commonName) : s.commonName,
    commonName: s.commonName,
    letter: cleanLetter(s.stopLetter), lat: s.lat, lon: s.lon, indicator: s.indicator,
    lines: (s.lines || []).map((l) => ({ id: l.id, name: l.name }))
  });
  saveFavs();
  refreshPin(s.naptanId);
  renderFavs();
}
function applyFilter(list, f) {
  if (!f) return list;
  if (f.routes) return list.filter((a) => f.routes.includes(a.lineName));
  return list.filter((a) => a.lineId === f.lineId && a.platformName === f.platform);
}

// ---------- Stop sheet ----------
let arrivals = [], fetchedAt = 0, refreshTimer = null, tickTimer = null, arrCtl = null, currentStop = null;
let selRoutes = new Set();   // bus: routes picked in the header
let platformFocus = null;    // tube: { lineId, lineName, platform } when opened from a saved platform

function openStop(s, filter = null) {
  closeSaved();
  const prev = selectedId;
  selectedId = s.naptanId; currentStop = s;
  if (prev) refreshPin(prev);
  refreshPin(s.naptanId);
  selRoutes = new Set(filter?.routes || []);
  platformFocus = filter && !filter.routes ? filter : null;

  const letter = $("s-letter");
  letter.className = "letter" + (mode === "tube" ? " tube" : "");
  letter.textContent = mode === "bus" ? (cleanLetter(s.stopLetter) || "•") : "";
  $("s-name").textContent = mode === "tube" ? cleanStation(s.commonName) : s.commonName;
  renderHeader();
  arrivals = []; fetchedAt = 0;
  $("s-list").innerHTML = '<div class="note">Loading departures…</div>';
  $("s-updated").textContent = "";
  $("sheet").classList.remove("closed");
  $("saved-btn").hidden = true;

  clearInterval(refreshTimer); clearInterval(tickTimer);
  loadArrivals();
  refreshTimer = setInterval(loadArrivals, REFRESH_MS);
  tickTimer = setInterval(renderArrivals, 1000);
}
function renderHeader() {
  const s = currentStop; if (!s) return;
  if (mode === "tube") {
    $("s-sub").textContent = "Underground station";
    $("s-routes").innerHTML = (s.lines || []).map((l) => `<span class="ln" style="${lineStyle(l.id)}">${esc(l.name)}</span>`).join("");
  } else {
    $("s-sub").textContent = (s.indicator ? s.indicator + " · " : "") + (selRoutes.size ? "Showing selected routes" : "Tap routes to filter");
    $("s-routes").innerHTML = (s.lines || []).map((l) =>
      `<button data-r="${esc(l.name)}" aria-pressed="${selRoutes.has(l.name)}">${esc(l.name)}</button>`).join("");
  }
  updateFavBtn();
}
$("s-routes").addEventListener("click", (e) => {
  const b = e.target.closest("button[data-r]"); if (!b || mode !== "bus") return;
  const r = b.dataset.r;
  selRoutes.has(r) ? selRoutes.delete(r) : selRoutes.add(r);
  renderHeader(); renderArrivals();
});
function currentFilter() {
  return mode === "bus" && selRoutes.size ? { routes: [...selRoutes] } : null;
}
function updateFavBtn() {
  const on = !!currentStop && isSaved(favKey(currentStop.naptanId, currentFilter()));
  $("s-fav").setAttribute("aria-pressed", String(on));
  const what = mode === "bus" && selRoutes.size ? "these routes" : "this stop";
  $("s-fav").setAttribute("aria-label", on ? `Remove ${what} from saved` : `Save ${what}`);
}
$("s-fav").addEventListener("click", () => {
  if (!currentStop) return;
  toggleSaved(currentStop, currentFilter());
  updateFavBtn();
});
function closeStop() {
  $("sheet").classList.add("closed");
  clearInterval(refreshTimer); clearInterval(tickTimer); arrCtl?.abort();
  const prev = selectedId; selectedId = null; currentStop = null;
  if (prev) refreshPin(prev);
  renderFavs();
}
$("s-close").addEventListener("click", closeStop);
$("s-refresh").addEventListener("click", () => loadArrivals());

async function loadArrivals() {
  if (!currentStop) return;
  arrCtl?.abort(); arrCtl = new AbortController();
  const id = currentStop.naptanId;
  try {
    const reqId = mode === "tube" ? await tubeId(id) : id;
    const data = await getJSON(url(`/StopPoint/${encodeURIComponent(reqId)}/Arrivals`), arrCtl.signal);
    if (!currentStop || currentStop.naptanId !== id) return;
    arrivals = data
      .filter((a) => mode === "bus" || a.modeName === "tube")
      .sort((a, b) => a.timeToStation - b.timeToStation);
    fetchedAt = Date.now();
    renderArrivals();
  } catch (e) {
    if (e.name === "AbortError") return;
    if (!arrivals.length) $("s-list").innerHTML = '<div class="note">Couldn\'t load departures. Tap Refresh to try again.</div>';
    $("s-updated").textContent = "Update failed";
  }
}
function dueText(secs) {
  const m = Math.floor(secs / 60);
  return m < 1 ? "Due" : `${m} min`;
}
const shortDue = (secs) => { const m = Math.floor(secs / 60); return m < 1 ? "Due" : `${m}m`; };

function renderArrivals() {
  if (!fetchedAt) return;
  const elapsed = (Date.now() - fetchedAt) / 1000;
  let live = arrivals
    .map((a) => ({ ...a, left: a.timeToStation - elapsed }))
    .filter((a) => a.left > -30);
  if (mode === "bus" && selRoutes.size) live = live.filter((a) => selRoutes.has(a.lineName));

  if (!live.length && !(mode === "tube" && platformFocus)) {
    $("s-list").innerHTML = `<div class="note">No ${mode === "bus" ? "buses" : "trains"} due in the next 30 minutes.</div>`;
  } else if (mode === "bus") {
    $("s-list").innerHTML = `<div class="section"><div class="board">${live.slice(0, 12).map((a, i) => `
      <div class="b-row">
        <span class="b-n">${i + 1}</span>
        <span class="b-route">${esc(a.lineName)}</span>
        <span class="b-dest"><span>${esc(a.destinationName)}</span></span>
        <span class="b-due${a.left < 60 ? " now" : ""}">${dueText(Math.max(0, a.left))}</span>
      </div>`).join("")}</div></div>`;
  } else {
    renderTube(live);
  }
  const t = new Date(fetchedAt);
  $("s-updated").textContent = "Updated " + t.toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit", second: "2-digit" });
}

// Tube: one board per line + platform, next 3 trains on each, each with its own save star
function renderTube(live) {
  const groups = new Map();
  for (const a of live) {
    const key = a.lineId + "|" + (a.platformName || "");
    if (!groups.has(key)) groups.set(key, { lineId: a.lineId, lineName: a.lineName, platform: a.platformName || "", trains: [] });
    groups.get(key).trains.push(a);
  }
  const order = (currentStop?.lines || []).map((l) => l.id);
  let sorted = [...groups.values()].sort((a, b) =>
    (order.indexOf(a.lineId) - order.indexOf(b.lineId)) || a.platform.localeCompare(b.platform, "en", { numeric: true }));
  const multiLine = new Set(sorted.map((g) => g.lineId)).size > 1 || (currentStop?.lines || []).length > 1;
  if (platformFocus) {
    const f = platformFocus;
    sorted = sorted.filter((g) => g.lineId === f.lineId && g.platform === f.platform);
    if (!sorted.length) sorted = [{ lineId: f.lineId, lineName: f.lineName, platform: f.platform, trains: [] }];
  }

  $("s-list").innerHTML = sorted.map((g) => {
    const fk = favKey(currentStop.naptanId, { lineId: g.lineId, platform: g.platform });
    const on = isSaved(fk);
    return `
    <div class="section">
      <div class="sec-head">
        ${multiLine ? `<span class="line-tag" style="${lineStyle(g.lineId)}">${esc(g.lineName)}</span>` : ""}
        <span class="plat">${esc(g.platform || g.lineName)}</span>
        ${g.platform ? `<button class="pstar" data-line="${esc(g.lineId)}" data-name="${esc(g.lineName)}" data-plat="${esc(g.platform)}" aria-pressed="${on}" aria-label="${on ? "Remove this platform from saved" : "Save this platform"}">${STAR_SVG}</button>` : ""}
      </div>
      ${g.trains.length ? `<div class="board tube">${g.trains.slice(0, 3).map((a, i) => `
        <div class="b-row">
          <span class="b-n">${i + 1}</span>
          <span class="b-dest"><span>${esc(cleanStation(a.destinationName) || a.towards || "Check front of train")}</span>${a.currentLocation ? `<small>${esc(a.currentLocation)}</small>` : ""}</span>
          <span class="b-due${a.left < 60 ? " now" : ""}">${dueText(Math.max(0, a.left))}</span>
        </div>`).join("")}</div>` : `<div class="note">No trains due on this platform right now.</div>`}
    </div>`;
  }).join("") + (platformFocus ? `<button class="show-all" id="show-all">Show all platforms</button>` : "");
}
$("s-list").addEventListener("click", (e) => {
  if (e.target.closest("#show-all")) { platformFocus = null; renderArrivals(); return; }
  const b = e.target.closest(".pstar"); if (!b || !currentStop) return;
  toggleSaved(currentStop, { lineId: b.dataset.line, lineName: b.dataset.name, platform: b.dataset.plat });
  renderArrivals();
});

// ---------- Saved sheet ----------
let savedData = new Map(), savedTimer = null, savedTick = null, editing = false;
function renderFavs() {
  const n = favs.length;
  $("saved-count").textContent = n;
  $("saved-count").hidden = !n;
  $("saved-btn").hidden = !!currentStop || !$("saved").classList.contains("closed");
}
function openSaved() {
  closeStop();
  editing = false;
  $("saved").classList.remove("closed");
  $("saved-btn").hidden = true;
  renderSaved();
  loadSaved();
  clearInterval(savedTimer); clearInterval(savedTick);
  savedTimer = setInterval(loadSaved, REFRESH_MS);
  savedTick = setInterval(renderSaved, 5000);
}
function closeSaved() {
  if ($("saved").classList.contains("closed")) return;
  $("saved").classList.add("closed");
  clearInterval(savedTimer); clearInterval(savedTick);
  renderFavs();
}
$("saved-btn").addEventListener("click", openSaved);
$("sv-close").addEventListener("click", closeSaved);
$("sv-edit").addEventListener("click", () => { editing = !editing; renderSaved(); });

async function loadSaved() {
  const ids = [...new Set(favs.map((f) => f.id))];
  await Promise.all(ids.map(async (id) => {
    try {
      const data = await getJSON(url(`/StopPoint/${encodeURIComponent(await tubeId(id))}/Arrivals`));
      savedData.set(id, { at: Date.now(), list: data.sort((a, b) => a.timeToStation - b.timeToStation) });
    } catch { if (!savedData.has(id)) savedData.set(id, { at: 0, list: null }); }
  }));
  renderSaved();
}
function summary(f) {
  const d = savedData.get(f.id);
  if (!d) return { text: "Loading…", dim: true };
  if (!d.list) return { text: "Couldn't load times", dim: true };
  const elapsed = (Date.now() - d.at) / 1000;
  let list = d.list.map((a) => ({ ...a, left: a.timeToStation - elapsed })).filter((a) => a.left > -30);
  if (f.mode === "tube") list = list.filter((a) => a.modeName === "tube");
  list = applyFilter(list, f.filter).slice(0, 3);
  if (!list.length) return { text: `No ${f.mode === "bus" ? "buses" : "trains"} due`, dim: true };
  const parts = list.map((a) => {
    const t = shortDue(Math.max(0, a.left));
    if (f.mode === "bus") return `${a.lineName} ${t}`;
    if (f.filter) {
      const dest = cleanStation(a.destinationName) || a.towards || "";
      return /check front/i.test(dest) || !dest ? t : `${dest} ${t}`;
    }
    return `${a.lineName} ${direction(a.platformName).charAt(0)} ${t}`;
  });
  return { text: parts.join(" · "), dim: false };
}
function renderSaved() {
  const el = $("sv-list");
  $("sv-edit").hidden = !favs.length;
  $("sv-edit").textContent = editing ? "Done" : "Edit";
  $("sv-sub").textContent = favs.length ? (editing ? "Remove the ones you don't need" : "Tap one for the full board") : "";
  if (!favs.length) {
    el.innerHTML = '<div class="note">Open a stop and tap the star to save it. You can also save just some bus routes, or one Tube platform.</div>';
    return;
  }
  el.innerHTML = favs.map((f) => {
    const s = summary(f);
    const icon = f.mode === "tube" ? `<span class="sv-ic tube"></span>` : `<span class="sv-ic">${esc(f.letter || "•")}</span>`;
    return `<div class="sv-row">
      <button class="sv-main" data-k="${esc(f.key)}">
        <span class="sv-top">${icon}<span class="sv-txt"><b>${esc(f.name)}</b><small>${esc(filterLabel(f))}</small></span></span>
        <span class="sv-next${s.dim ? " dim" : ""}">${esc(s.text)}</span>
      </button>
      ${editing ? `<button class="sv-del" data-del="${esc(f.key)}" aria-label="Remove ${esc(f.name)}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>` : ""}
    </div>`;
  }).join("");
}
$("sv-list").addEventListener("click", (e) => {
  const del = e.target.closest("[data-del]");
  if (del) {
    const f = favs.find((x) => x.key === del.dataset.del);
    favs = favs.filter((x) => x.key !== del.dataset.del); saveFavs();
    if (f) refreshPin(f.id);
    if (!favs.length) editing = false;
    renderSaved(); renderFavs();
    return;
  }
  const b = e.target.closest(".sv-main"); if (!b || editing) return;
  const f = favs.find((x) => x.key === b.dataset.k); if (!f) return;
  if (f.mode !== mode) setMode(f.mode, { load: false });
  const s = stops.get(f.id) || { naptanId: f.id, commonName: f.commonName || f.name, stopLetter: f.letter, indicator: f.indicator, lat: f.lat, lon: f.lon, lines: f.lines || [] };
  map.setView([f.lat, f.lon], f.mode === "tube" ? Math.max(map.getZoom(), 15) : Math.max(map.getZoom(), 17));
  loadStops();
  openStop(s, f.filter);
});

// Pause polling when the app is in the background
// When the app comes back after a while, re-centre on where you are now
let hiddenAt = 0;
const RECENTRE_AFTER_MS = 5 * 60 * 1000;
document.addEventListener("visibilitychange", () => {
  if (document.hidden) { hiddenAt = Date.now(); clearInterval(refreshTimer); stopWatch(); return; }
  if (haveFix) startWatch();
  if (currentStop) { loadArrivals(); clearInterval(refreshTimer); refreshTimer = setInterval(loadArrivals, REFRESH_MS); }
  else if (hiddenAt && Date.now() - hiddenAt > RECENTRE_AFTER_MS) locate(true);
});

setMode(mode, { load: false });
loadStops();
// Every launch opens on your location (falls back to the last map view if location is off)
locate(true);
</script>
</body>
